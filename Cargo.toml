[package]
name = "johnnybt_ledger_polars"
version = "0.1.0"
edition = "2021"
description = "An amount-based bookkeeping policy for johnnybt's account walk, as a polars plugin."
license = "MIT"
repository = "https://github.com/quant-on-quest/johnnybt-ledger-polars"
readme = "README.md"

[lib]
name = "johnnybt_ledger_polars"
crate-type = ["cdylib"]

[dependencies]
johnnybt_engine = { version = "0.1", path = "../johnnybt_engine", features = ["polars"] }
polars = { version = "0.55.1", features = ["dtype-struct"], default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
