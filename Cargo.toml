[package]
name = "johnnybt_ledger_polars"
version = "0.1.0"
edition = "2021"

[lib]
name = "johnnybt_ledger_polars"
crate-type = ["cdylib"]

[dependencies]
johnnybt_engine = { path = "../johnnybt_engine", features = ["polars"] }
polars = { version = "0.55.1", features = ["dtype-struct"], default-features = false }
pyo3 = { version = "0.29", features = ["abi3-py311"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
